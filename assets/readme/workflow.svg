<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">alnav workflow</title>
  <desc id="wdesc">Two entry paths from the same inputs: default alnav opens the TUI; alnav grep runs the CLI filter pipeline.</desc>
  <rect width="1200" height="300" rx="24" fill="#0b1218" stroke="#243442" stroke-width="2"/>
  <text x="56" y="48" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">HOW IT SPLITS</text>
  <text x="56" y="88" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" font-weight="700">一条产品，两种入口</text>
  <g transform="translate(56 130)">
    <rect width="240" height="120" rx="16" fill="#12202a" stroke="#2a4152"/>
    <text x="24" y="44" fill="#9fb3c4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">输入</text>
    <text x="24" y="80" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">-f / --adb / --hdc</text>
  </g>
  <path d="M296 190 H360" stroke="#67e8f9" stroke-width="3" fill="none"/>
  <path d="M360 140 V240" stroke="#67e8f9" stroke-width="3" fill="none"/>
  <path d="M360 140 H400" stroke="#67e8f9" stroke-width="3" fill="none"/>
  <path d="M360 240 H400" stroke="#67e8f9" stroke-width="3" fill="none"/>
  <polygon points="400,132 420,140 400,148" fill="#67e8f9"/>
  <polygon points="400,232 420,240 400,248" fill="#67e8f9"/>
  <g transform="translate(436 88)">
    <rect width="320" height="100" rx="16" fill="#0f2430" stroke="#22d3ee"/>
    <text x="24" y="36" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">alnav</text>
    <text x="24" y="68" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600">交互式 TUI</text>
  </g>
  <g transform="translate(436 198)">
    <rect width="320" height="100" rx="16" fill="#12202a" stroke="#2a4152"/>
    <text x="24" y="36" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">alnav grep ...</text>
    <text x="24" y="68" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600">纯 CLI / Agent</text>
  </g>
  <g transform="translate(800 130)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="0" y="36" fill="#8aa0b2" font-size="18">chip · 书签 · yc 导出</text>
    <text x="0" y="84" fill="#8aa0b2" font-size="18">-e · summary · crashes</text>
  </g>
</svg>
