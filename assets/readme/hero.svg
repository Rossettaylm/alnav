<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">alnav - App / Android Log Navigator</title>
  <desc id="desc">Terminal-native log navigator: vim-style TUI by default, alnav grep for scripted CLI filtering of Android and HarmonyOS logs.</desc>
  <defs>
