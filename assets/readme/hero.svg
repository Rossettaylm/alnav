      <stop offset="0%" stop-color="#0b1218"/>
      <stop offset="100%" stop-color="#101a22"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c2a35"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)" opacity="0.55"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="27" fill="none" stroke="#243442" stroke-width="2"/>
