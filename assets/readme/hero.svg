    <text x="0" y="222" fill="#8aa0b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">logcat / xlog / hilog · 过滤 · 崩溃 · 聚合</text>
