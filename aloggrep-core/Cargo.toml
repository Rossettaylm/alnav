[package]
name = "aloggrep-core"
version = "0.1.7"
edition = "2021"
description = "Lightweight Android logcat/xlog/HarmonyOS hilog log filter and analyzer CLI"
license = "MIT"
authors = ["Lyman Yang"]
repository = "https://github.com/Rossettaylm/loggrep"
keywords = ["android", "logcat", "log", "filter", "analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"
default-run = "aloggrep"

[lib]
name = "aloggrep"
path = "src/lib.rs"

[[bin]]
name = "aloggrep"
path = "src/main.rs"

[[bin]]
name = "alg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
atty = "0.2"
ctrlc = "3"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
