[package]
name = "alnav"
version = "0.2.3"
edition = "2021"
description = "App/Android Log Navigator — interactive TUI (default) and CLI (`alnav grep`)"
license = "MIT"
authors = ["Lyman Yang"]
repository = "https://github.com/Rossettaylm/alnav"
keywords = ["android", "logcat", "tui", "log", "filter"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "alnav"
path = "src/main.rs"

# Compat aliases (remove next major). Disable harness so unit tests in main.rs
# run once via the primary `alnav` target, not 4×.
[[bin]]
name = "aloggrep"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "alg"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "aloggrep-tui"
path = "src/main.rs"
test = false
bench = false

[dependencies]
alnav-core = { path = "../alnav-core", version = "0.2.3" }
arboard = "3"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
regex = "1"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
lru = "0.12"
unicode-width = "0.2"
memmap2 = "0.9.11"
memchr = "2.8.3"
nucleo-matcher = "0.3"
unicode-segmentation = "1.13.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
