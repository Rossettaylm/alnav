# alnav theme.toml — TUI 颜色 overlay
#
# 复制到 `$ALNAV_HOME/theme.toml`（默认 ~/.config/alnav/theme.toml）
# 或 `--config-path DIR` 指向的目录。可整份省略：只用 config.toml 的 `theme`。
#
# 叠在内置主题之上（改完需重启）：
#   1. [palette] 先合并进 18 槽 ANSI，再重新映射
#   2. 其余键覆盖语义色（强调 / 选中底 / highlight 等）
# 颜色：named（cyan、darkgray、reset…）或 #RGB / #RRGGBB。
# highlight 若出现则必须正好 8 项，否则整份 overlay 丢弃并回退。
#
# accent 只改 chrome 强调色（边框、Compact 字标、Tag）；
# Dashboard 六行 Unicode 字标仍走该内置主题的渐变。

# accent = "#7aa2f7"
# success = "green"
# warning = "yellow"
# lock = "magenta"
# selection_frame = "magenta"
# log_selection_bg = "darkgray"
# log_visual_bg = "#1e3c46"
# preview_highlight_bg = "darkgray"
# border_inactive = "darkgray"
# candidate_selected_bg = "darkgray"
# candidate_selected_fg = "white"
# candidate_unselected_bg = "reset"
# candidate_unselected_fg = "gray"
# candidate_match_fg = "cyan"
# candidate_prefix = "▌ "
# bookmark_strip_bg = "darkgray"
# bookmark_row_bg = "#362e00"

