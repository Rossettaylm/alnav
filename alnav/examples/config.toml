# alnav config.toml — 复制到 `$ALNAV_HOME/config.toml`
#（默认 ~/.config/alnav/config.toml），或 `alnav --init` 生成。
#
# TUI 主题（改完需重启）。九套内置 + 签名强调色（边框 / Compact 字标）：
#   default            青 Cyan，不涂画布；六行字标纯色
#   onedark            蓝
#   dracula            品红
#   everforest         绿
#   tokyo-night        蓝     （别名 TokyoNight / tokyo_night）
#   catppuccin-mocha   品红   （别名 catppuccin / mocha）
#   gruvbox-dark       黄     （别名 gruvbox）
#   nord               青
#   kanagawa           蓝     （别名 kanagawa-wave）
# 细调颜色用同目录 theme.toml（overlay，可省略）。
theme = "default"
# theme = "kanagawa"

# 搜索面板左栏宽度占比（右栏 = 1 - 该值）。默认 0.4（4:6）
picker_left_ratio = 0.4

# 是否显示搜索面板右侧 Preview 栏。默认 true。
# 设为 false 时所有 Picker 面板均全宽展示，不渲染右侧预览列。
# 注意：聚合面板（Space Space）无论此项设置如何，始终全宽（无 Preview）。
picker_preview_enabled = true

# Dashboard / of 最近文件条数上限（1..=200）。默认 20。
recent_files_limit = 20

# Open file（of）模糊检索语料目录（递归扫描）。空 = 仅 recent。支持 ~。
log_dirs = []

# 语料文件后缀过滤（忽略大小写）。省略或空列表 → 默认 .log / .txt。
log_extensions = [".log", ".txt"]
