[package]
name = "aloggrep"
version = "0.1.1"
edition = "2021"
description = "Lightweight Android logcat/xlog log filter and analyzer CLI"
license = "MIT"
authors = ["Lyman Yang"]
repository = "https://github.com/Rossettaylm/loggrep"
keywords = ["android", "logcat", "log", "filter", "analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
atty = "0.2"
